name: Test release-pr command with verbose flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up a minimal Rust project in the workspace so release-plz has something to work with
      - name: Set up minimal Rust project
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/rust-project/Cargo.toml" "$GITHUB_WORKSPACE/Cargo.toml" || true
          mkdir -p "$GITHUB_WORKSPACE/src"
          cp "$GITHUB_WORKSPACE/tests/fixtures/rust-project/src/lib.rs" "$GITHUB_WORKSPACE/src/lib.rs" || true
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add Cargo.toml src/ 2>/dev/null || true
          git commit -m "chore: add test crate" --allow-empty 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          verbose: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with verbose flag (sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbose flag (prs_created=$PRS_CREATED)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
