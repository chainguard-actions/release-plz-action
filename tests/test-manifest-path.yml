name: Test manifest_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a minimal Rust project for release-plz to work with
      - name: Set up minimal Cargo project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-crate/src"
          cat > "$GITHUB_WORKSPACE/my-crate/Cargo.toml" << 'EOF'
          [package]
          name = "my-crate"
          version = "0.1.0"
          edition = "2021"
          description = "Test package for release-plz action"
          license = "MIT"

          [lib]
          name = "my_crate"
          path = "src/lib.rs"
          EOF
          echo "// test" > "$GITHUB_WORKSPACE/my-crate/src/lib.rs"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add my-crate/
          git commit -m "feat: initial commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          manifest_path: my-crate/Cargo.toml
          version: "0.3.169"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with manifest_path (sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$PRS_CREATED" ]; then
              echo "FAIL: action succeeded but prs_created output is empty"
              exit 1
            fi
            echo "PASS: prs_created=$PRS_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
