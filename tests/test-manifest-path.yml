name: Test manifest_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Cargo.toml
        run: |
          mkdir -p /tmp/myproject
          cat > /tmp/myproject/Cargo.toml << 'EOF'
          [package]
          name = "myproject"
          version = "0.1.0"
          edition = "2021"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          manifest_path: /tmp/myproject/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (manifest_path input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with manifest_path input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
