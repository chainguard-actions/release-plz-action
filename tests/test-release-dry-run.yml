name: Test release command with dry_run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a minimal Rust workspace for release-plz
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" << 'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (release with dry_run and sentinel repo fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, releases_created should be a boolean
            if [ "$RELEASES_CREATED" != "true" ] && [ "$RELEASES_CREATED" != "false" ]; then
              echo "FAIL: expected releases_created to be 'true' or 'false', got: '$RELEASES_CREATED'"
              exit 1
            fi
            echo "PASS: action succeeded with releases_created=$RELEASES_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
