name: Test release command with dry_run, token, and project_manifest inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: release
          dry_run: "true"
          token: fake-cargo-registry-token
          project_manifest: Cargo.toml
        continue-on-error: true
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may have failed due to missing real token/repo, which is expected)"
          echo "PASS: inputs dry_run, token, and project_manifest were accepted"
