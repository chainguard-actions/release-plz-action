name: Test release-plz release command with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up minimal Cargo workspace
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" << 'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add Cargo.toml src/
          git commit -m "feat: initial commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert release command with dry-run ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES: ${{ steps.action.outputs.releases }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases: $RELEASES"
          echo "releases_created: $RELEASES_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            # When successful, releases_created should be set (true or false)
            if [ -z "$RELEASES_CREATED" ]; then
              echo "FAIL: action succeeded but releases_created output is empty"
              exit 1
            fi
            echo "PASS: release command with dry-run ran, releases_created=$RELEASES_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or missing Cargo.lock)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
