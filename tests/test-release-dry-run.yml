name: Test release command with dry_run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Copy fixture Cargo project into workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/rust-project/." "$GITHUB_WORKSPACE/"
          git add Cargo.toml src/
          git commit -m "feat: add initial crate" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
          manifest_path: Cargo.toml

      - name: Assert action ran (release dry_run command)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
          RELEASES: ${{ steps.action.outputs.releases }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          echo "releases: $RELEASES"
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, releases_created should be set
            if [ -z "$RELEASES_CREATED" ]; then
              echo "FAIL: action succeeded but releases_created output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with releases_created=$RELEASES_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or no tag)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
