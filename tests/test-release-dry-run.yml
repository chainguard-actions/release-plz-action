name: Test release-plz release command with dry_run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a minimal Rust project so release-plz can parse the manifest
      - name: Set up minimal Cargo project
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" <<'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"

      # Run only the release command with dry_run=true. The action will attempt
      # to call the GitHub API using the sentinel GITHUB_REPOSITORY, which does
      # not exist, so the step is expected to fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          dry_run: "true"

      - name: Assert release (dry-run) ran (failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
          RELEASES: ${{ steps.action.outputs.releases }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          echo "releases: $RELEASES"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, releases_created must be a boolean string
            if [ "$RELEASES_CREATED" != "true" ] && [ "$RELEASES_CREATED" != "false" ]; then
              echo "FAIL: releases_created output is not a boolean: '$RELEASES_CREATED'"
              exit 1
            fi
            echo "PASS: action succeeded, releases_created=$RELEASES_CREATED"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
