name: Test release-plz with config and manifest_path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up minimal Cargo workspace with config file
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" << 'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"
          # Create a minimal release-plz config file
          cat > "$GITHUB_WORKSPACE/release-plz-custom.toml" << 'EOF'
          [workspace]
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add Cargo.toml src/ release-plz-custom.toml
          git commit -m "feat: initial commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          config: release-plz-custom.toml
          manifest_path: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with config and manifest_path inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PRS_CREATED" ]; then
              echo "FAIL: action succeeded but prs_created output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with config and manifest_path inputs, prs_created=$PRS_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
