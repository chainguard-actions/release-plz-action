name: Test gitea forge with release dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git identity (git-config step is skipped for gitea)
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          forge: gitea
          dry_run: "true"
          manifest_path: tests/fixtures/sample-crate/Cargo.toml
      - name: Assert outputs (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES: ${{ steps.action.outputs.releases }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases: $RELEASES"
          echo "releases_created: $RELEASES_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RELEASES" | jq -e 'type == "array"' >/dev/null; then
              echo "FAIL: releases is not a JSON array"
              exit 1
            fi
            if [ "$RELEASES_CREATED" != "true" ] && [ "$RELEASES_CREATED" != "false" ]; then
              echo "FAIL: releases_created must be true/false"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (harness repo is not a real gitea/github repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
