name: Test forge gitea input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          forge: gitea
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          # With gitea forge, the git-config step is skipped (only runs for github forge)
          # The action should either succeed or fail gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with gitea forge"
            if [ -z "$PRS_CREATED" ]; then
              echo "FAIL: prs_created output is empty on success"
              exit 1
            fi
            echo "PASS: prs_created='$PRS_CREATED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or gitea not configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
