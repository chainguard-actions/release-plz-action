name: Test release-plz with registry, token, and project_manifest inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up minimal Cargo workspace with custom registry config
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" << 'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"

          [registries]
          my-registry = { index = "https://my-intranet:8080/git/index" }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add Cargo.toml src/
          git commit -m "feat: initial commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
          registry: my-registry
          token: fake-registry-token
          project_manifest: Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with registry, token, and project_manifest inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASES_CREATED" ]; then
              echo "FAIL: action succeeded but releases_created output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with registry, token, and project_manifest inputs, releases_created=$RELEASES_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or invalid registry)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
