name: Test registry and token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          registry: my-registry
          token: fake-registry-token
          dry_run: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with registry and token inputs (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
          RELEASES: ${{ steps.action.outputs.releases }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          echo "releases: $RELEASES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASES_CREATED" ]; then
              echo "FAIL: action succeeded but releases_created output is empty"
              exit 1
            fi
            echo "PASS: got releases_created='$RELEASES_CREATED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing Cargo.toml)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
