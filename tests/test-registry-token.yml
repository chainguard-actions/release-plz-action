name: Test custom registry and registry token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Declare a named registry in the Cargo config
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          cat >> "${CARGO_HOME:-$HOME/.cargo}/config.toml" <<'EOF'
          [registries.my-registry]
          index = "sparse+https://index.crates.io/"
          EOF
          cat "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          registry: my-registry
          token: dummy-registry-token-not-used-in-dry-run
          dry_run: "true"
          manifest_path: tests/fixtures/sample-crate/Cargo.toml
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES: ${{ steps.action.outputs.releases }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releases: $RELEASES"
          echo "releases_created: $RELEASES_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RELEASES" | jq -e 'type == "array"' >/dev/null; then
              echo "FAIL: releases is not a JSON array"
              exit 1
            fi
            if [ "$RELEASES_CREATED" != "true" ] && [ "$RELEASES_CREATED" != "false" ]; then
              echo "FAIL: releases_created must be true/false"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / harness limitations)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
