name: Test release-pr command with config and manifest_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: release-pr
          config: release-plz.toml
          manifest_path: Cargo.toml
          token: fake-registry-token
        continue-on-error: true
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed (may have failed due to missing Cargo.toml or auth, but inputs were accepted)"
          echo "PASS: inputs command, config, manifest_path, token were accepted by the action"
