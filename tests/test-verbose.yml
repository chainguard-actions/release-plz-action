name: Test release-plz with verbose flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a minimal Rust project so release-plz has something to work with
      - name: Set up minimal Cargo workspace
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" <<'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          verbose: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert verbose release-pr ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRS_CREATED" != "true" ] && [ "$PRS_CREATED" != "false" ]; then
              echo "FAIL: prs_created should be 'true' or 'false', got '$PRS_CREATED'"
              exit 1
            fi
            echo "PASS: action succeeded with verbose flag, prs_created=$PRS_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
