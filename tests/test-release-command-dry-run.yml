name: Test release command with dry_run, registry, token, and project_manifest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
      GITHUB_REPOSITORY: fake-owner/fake-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
          registry: my-registry
          token: fake-cargo-token
          project_manifest: Cargo.toml
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (possibly with error due to missing real Cargo project)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should have started (inputs were accepted by the composite action)
          # It may fail at the release-plz execution step, which is expected in test env
          echo "PASS: inputs were accepted"
