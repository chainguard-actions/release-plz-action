name: Test release command with dry_run and verbose inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          verbose: "true"
          dry_run: "true"
      - name: Assert action ran (may fail due to missing real token/project)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail in a test environment without a real
          # Rust project and GitHub token. We just verify the inputs were accepted
          # (i.e., the action started and processed inputs before failing).
          # A 'success' or 'failure' outcome both indicate the action ran.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with command=release, verbose=true, dry_run=true"
