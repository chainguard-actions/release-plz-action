name: Test release command with dry-run and verbose
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: release
          dry_run: "true"
          verbose: "true"
        continue-on-error: true
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed (may have failed due to missing Cargo.toml or auth, but inputs were accepted)"
          echo "PASS: inputs command, dry_run, verbose were accepted by the action"
