name: Test release-pr command with config and verbose
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          config: release-plz.toml
          verbose: "true"
          token: fake-registry-token
      - name: Assert inputs were accepted
        run: |
          echo "Action completed (may have failed due to missing credentials, which is expected)"
          echo "PASS: inputs command, config, verbose, token were accepted by the action"
