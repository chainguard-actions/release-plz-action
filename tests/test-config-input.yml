name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal release-plz config file
        run: |
          cat > /tmp/release-plz-test.toml << 'EOF'
          [workspace]
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          config: /tmp/release-plz-test.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (config input accepted, graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
