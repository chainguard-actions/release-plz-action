name: Test project_manifest deprecated input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: release-pr
          project_manifest: ${{ github.workspace }}/hardened/tests/fixtures/cargo-project/Cargo.toml
          forge: github
          version: "0.3.158"
        continue-on-error: true

      - name: Assert action ran with project_manifest input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          # The deprecated project_manifest input should be accepted by the action.
          # The action may fail due to environment constraints (auth, etc.) but
          # should not fail due to the input being unrecognized.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRS_CREATED" != "true" ] && [ "$PRS_CREATED" != "false" ]; then
              echo "FAIL: prs_created should be 'true' or 'false', got: '$PRS_CREATED'"
              exit 1
            fi
            echo "PASS: project_manifest input accepted - prs_created=$PRS_CREATED"
          else
            echo "PASS: action ran (outcome=$OUTCOME) - may have failed due to environment constraints"
          fi
