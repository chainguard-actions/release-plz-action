name: Test project_manifest input (deprecated alias for manifest_path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Cargo.toml
        run: |
          mkdir -p /tmp/myproject2
          cat > /tmp/myproject2/Cargo.toml <<'EOF'
          [package]
          name = "myproject2"
          version = "0.1.0"
          edition = "2021"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          project_manifest: /tmp/myproject2/Cargo.toml
      - name: Assert action ran with project_manifest input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
