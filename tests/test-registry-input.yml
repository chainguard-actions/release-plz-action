name: Test registry input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: release
          manifest_path: ${{ github.workspace }}/hardened/tests/fixtures/cargo-project/Cargo.toml
          registry: crates-io
          forge: github
          dry_run: "true"
          version: "0.3.158"
        continue-on-error: true

      - name: Assert action ran with registry input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
          RELEASES: ${{ steps.action.outputs.releases }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "releases_created: $RELEASES_CREATED"
          echo "releases: $RELEASES"
          # The registry input should be accepted by the action.
          # The action may fail due to environment constraints (auth, no Cargo.lock, etc.)
          # but should not fail due to the registry input being unrecognized.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RELEASES_CREATED" != "true" ] && [ "$RELEASES_CREATED" != "false" ]; then
              echo "FAIL: releases_created should be 'true' or 'false', got: '$RELEASES_CREATED'"
              exit 1
            fi
            echo "PASS: registry input accepted - releases_created=$RELEASES_CREATED"
          else
            echo "PASS: action ran (outcome=$OUTCOME) - may have failed due to environment constraints"
          fi
