name: Test release-plz basic usage (both commands)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a minimal Rust project so release-plz can parse the manifest
      - name: Set up minimal Cargo project
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" <<'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"

      # The action installs release-plz and runs both release-pr and release.
      # Both commands make GitHub API calls against GITHUB_REPOSITORY which is
      # a sentinel (non-existent) repo, so the action is expected to fail.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran (failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly — outputs may be empty but that is acceptable"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
