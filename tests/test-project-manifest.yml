name: Test release-pr with project_manifest input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up a minimal Rust project in a subdirectory
      - name: Set up minimal Rust project in subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/legacy-crate/src"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/rust-project/Cargo.toml" "$GITHUB_WORKSPACE/legacy-crate/Cargo.toml" || true
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/rust-project/src/lib.rs" "$GITHUB_WORKSPACE/legacy-crate/src/lib.rs" || true
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add legacy-crate/ 2>/dev/null || true
          git commit -m "chore: add legacy test crate" --allow-empty 2>/dev/null || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          project_manifest: legacy-crate/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with project_manifest input (sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with project_manifest input (prs_created=$PRS_CREATED)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
