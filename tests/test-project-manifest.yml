name: Test project_manifest input (deprecated)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Cargo.toml for testing
        run: |
          mkdir -p /tmp/test-crate-pm
          cat > /tmp/test-crate-pm/Cargo.toml << 'EOF'
          [package]
          name = "test-crate-pm"
          version = "0.1.0"
          edition = "2021"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          project_manifest: /tmp/test-crate-pm/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran with project_manifest input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with project_manifest input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
