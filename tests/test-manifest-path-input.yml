name: Test manifest_path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal Cargo.toml for manifest_path
        run: |
          mkdir -p /tmp/test-crate
          cat > /tmp/test-crate/Cargo.toml << 'EOF'
          [package]
          name = "test-crate"
          version = "0.1.0"
          edition = "2021"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          manifest_path: /tmp/test-crate/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action ran (manifest_path input accepted, graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
