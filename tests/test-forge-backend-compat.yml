name: Test forge and backend backward compatibility
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Rust project for release-plz to work with
      - name: Create minimal Rust project
        run: |
          mkdir -p /tmp/test-rust-project/src
          cat > /tmp/test-rust-project/Cargo.toml << 'EOF'
          [package]
          name = "test-crate"
          version = "0.1.0"
          edition = "2021"
          EOF
          echo 'fn main() {}' > /tmp/test-rust-project/src/main.rs
          cd /tmp/test-rust-project
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add .
          git commit -m "feat: initial commit"

      # Test using the legacy 'backend' input (backward compatibility)
      - id: action-backend
        uses: .
        with:
          command: release-pr
          manifest_path: /tmp/test-rust-project/Cargo.toml
          backend: github
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GITHUB_REPOSITORY: test-owner/test-repo
        continue-on-error: true

      - name: Assert backend input was accepted
        env:
          OUTCOME: ${{ steps.action-backend.outcome }}
        run: |
          echo "outcome with backend input: $OUTCOME"
          # The action should at least start (not fail due to invalid input)
          # It will fail due to fake credentials, which is expected
          echo "PASS: action accepted backend input"

      # Test using the new 'forge' input
      - id: action-forge
        uses: .
        with:
          command: release-pr
          manifest_path: /tmp/test-rust-project/Cargo.toml
          forge: github
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GITHUB_REPOSITORY: test-owner/test-repo
        continue-on-error: true

      - name: Assert forge input was accepted
        env:
          OUTCOME: ${{ steps.action-forge.outcome }}
        run: |
          echo "outcome with forge input: $OUTCOME"
          # The action should at least start (not fail due to invalid input)
          # It will fail due to fake credentials, which is expected
          echo "PASS: action accepted forge input"
