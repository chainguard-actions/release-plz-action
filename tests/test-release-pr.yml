name: Test release-pr command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a minimal Rust project
        run: |
          cat > "$GITHUB_WORKSPACE/Cargo.toml" << 'EOF'
          [package]
          name = "test-pkg"
          version = "0.1.0"
          edition = "2021"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo 'fn main() {}' > "$GITHUB_WORKSPACE/src/main.rs"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add Cargo.toml src/
          git commit -m "feat: initial commit" || true

      - name: Set up git origin reachable inside the action
        run: |
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert release-pr ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
          PR: ${{ steps.action.outputs.pr }}
          PRS: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          echo "pr: $PR"
          echo "prs: $PRS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$PRS_CREATED" ]; then
              echo "FAIL: action succeeded but prs_created output was not set"
              exit 1
            fi
            echo "PASS: prs_created='$PRS_CREATED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
