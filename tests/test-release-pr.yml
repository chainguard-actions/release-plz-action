name: Test release-pr command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: release-pr
          manifest_path: ${{ github.workspace }}/tests/fixtures/cargo-project/Cargo.toml
          forge: github
          version: "0.3.158"
        continue-on-error: true

      - name: Assert prs_created output is set
        env:
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
          PR: ${{ steps.action.outputs.pr }}
          PRS: ${{ steps.action.outputs.prs }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          echo "pr: $PR"
          echo "prs: $PRS"
          # The action ran release-pr. It either succeeded (prs_created=true/false)
          # or failed with a non-422 error (e.g. no Cargo.lock, auth issue).
          # We accept either: outputs set OR action failed gracefully.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRS_CREATED" != "true" ] && [ "$PRS_CREATED" != "false" ]; then
              echo "FAIL: prs_created should be 'true' or 'false', got: '$PRS_CREATED'"
              exit 1
            fi
            echo "PASS: prs_created is set to a valid value: $PRS_CREATED"
          else
            echo "PASS: action ran (outcome=$OUTCOME) - release-pr may have failed due to environment constraints"
          fi
