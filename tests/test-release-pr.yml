name: Test release-pr command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure Rust toolchain is available
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          manifest_path: tests/fixtures/sample-crate/Cargo.toml
      - name: Assert release-pr outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS: ${{ steps.action.outputs.prs }}
          PR: ${{ steps.action.outputs.pr }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs: $PRS"
          echo "pr: $PR"
          echo "prs_created: $PRS_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$PRS_CREATED" != "true" ] && [ "$PRS_CREATED" != "false" ]; then
              echo "FAIL: prs_created must be true or false"
              exit 1
            fi
            if ! echo "$PRS" | jq -e 'type == "array"' >/dev/null; then
              echo "FAIL: prs should be a JSON array"
              exit 1
            fi
            if ! echo "$PR" | jq -e 'type == "object"' >/dev/null; then
              echo "FAIL: pr should be a JSON object"
              exit 1
            fi
            if [ -n "$RELEASES_CREATED" ]; then
              echo "FAIL: release should not have run with command=release-pr"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
