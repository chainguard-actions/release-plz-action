name: Test release-pr command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure Rust toolchain is available
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      # release-pr talks to the GitHub API for GITHUB_REPOSITORY, which is a
      # non-existent sentinel under the harness, so a failure is acceptable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr
          version: "0.3"
          manifest_path: tests/fixtures/sample-crate/Cargo.toml
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.prs_created }}
          PR: ${{ steps.action.outputs.pr }}
          RELEASES_CREATED: ${{ steps.action.outputs.releases_created }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $RESULT"
          echo "pr: $PR"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ]; then
              echo "FAIL: prs_created should be true/false, got '$RESULT'"
              exit 1
            fi
            if [ -z "$PR" ]; then
              echo "FAIL: pr output is empty"
              exit 1
            fi
            if [ -n "$RELEASES_CREATED" ]; then
              echo "FAIL: release should not run when command=release-pr"
              exit 1
            fi
            echo "PASS: got prs_created='$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
