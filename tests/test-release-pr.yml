name: Test release-pr command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release-pr

      - name: Assert action ran (release-pr fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PRS_CREATED: ${{ steps.action.outputs.prs_created }}
          PRS: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "prs_created: $PRS_CREATED"
          echo "prs: $PRS"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, prs_created should be a boolean
            if [ "$PRS_CREATED" != "true" ] && [ "$PRS_CREATED" != "false" ]; then
              echo "FAIL: prs_created output should be 'true' or 'false', got: '$PRS_CREATED'"
              exit 1
            fi
            echo "PASS: action succeeded with prs_created=$PRS_CREATED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
