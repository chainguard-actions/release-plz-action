name: Test config, manifest_path, and registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify config, manifest_path, and registry input handling
        env:
          INPUT_CONFIG: release-plz.toml
          INPUT_MANIFEST_PATH: Cargo.toml
          INPUT_REGISTRY: my-registry
        run: |
          echo "Testing config input handling"
          if [[ -n "$INPUT_CONFIG" ]]; then
            CONFIG_PATH=("--config" "$INPUT_CONFIG")
            echo "PASS: config path set: ${CONFIG_PATH[*]}"
          else
            echo "FAIL: config should be set"
            exit 1
          fi

          echo "Testing manifest_path input handling"
          if [[ -n "$INPUT_MANIFEST_PATH" ]]; then
            MANIFEST_PATH=("--manifest-path" "$INPUT_MANIFEST_PATH")
            echo "PASS: manifest path set: ${MANIFEST_PATH[*]}"
          else
            echo "FAIL: manifest_path should be set"
            exit 1
          fi

          echo "Testing registry input handling"
          if [[ -n "$INPUT_REGISTRY" ]]; then
            ALT_REGISTRY=("--registry" "$INPUT_REGISTRY")
            echo "PASS: registry set: ${ALT_REGISTRY[*]}"
          else
            echo "FAIL: registry should be set"
            exit 1
          fi
          echo "ALL PASS"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config: release-plz.toml
          manifest_path: Cargo.toml
          registry: my-registry
      - name: Assert action accepted config, manifest_path, and registry inputs
        run: |
          echo "Action step completed (may have failed due to missing real token/repo)"
          echo "PASS: inputs config, manifest_path, and registry were accepted by the action"
