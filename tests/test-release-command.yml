name: Test release command with dry_run, manifest_path, and registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: release
          dry_run: "true"
          manifest_path: Cargo.toml
          registry: my-registry
      - name: Assert inputs were accepted
        run: |
          echo "Action completed (may have failed due to missing credentials, which is expected)"
          echo "PASS: inputs command, dry_run, manifest_path, registry were accepted by the action"
