name: "release-plz"
author: "Marco Ieni"
description: "Update version and changelog based on semantic versioning and conventional commits"
inputs:
  command:
    description: "The release-plz command to run. Accepted values: `release-pr`, `release`. If unspecified, this action runs both these commands."
    required: false
  registry:
    description: "Registry where the packages are stored. The registry name needs to be present in the Cargo config. If unspecified, crates.io is used."
    required: false
  config:
    description: "Config file location. If not present, the default 'release-plz.toml' is used."
    required: false
  forge:
    description: "Git forge/backend. Valid values: 'github', 'gitea'"
    default: "github"
    required: false
  backend:
    description: "Supported for backward compatibility. Use 'forge' instead."
    default: "github"
    required: false
  manifest_path:
    description: "Path to the Cargo.toml of the project you want to update. If not provided, release-plz will use the Cargo.toml of the root directory. Both Cargo workspaces and single packages are supported."
    required: false
  project_manifest:
    description: "Deprecated. Use `manifest_path` instead."
    required: false
  version:
    description: "Release-plz version to use. (Default: `0.3.160`)."
    default: "0.3.160"
    required: false
  token:
    description: "Token used to publish to the cargo registry"
    required: false
  verbose:
    description: "Print module and source location in logs."
    required: false
  dry_run:
    description: "Add the `--dry-run` flag to the `release` command. If the input `command` is left unspecified (and so both `release` and `release-pr` are ran), the `--dry-run` flag is only added to the `release` command (the flag isn't added to the `release-pr` command). Useful if you're only interested in whether or not a release (pr) would be created."
    required: false
outputs:
  # Useful for when https://github.com/release-plz/release-plz/issues/1029 is implemented.
  # For now, it just returns an array with `pr` in it.
  prs:
    description: "The release PRs opened by release-plz. (Not useful for now. Use `pr` instead)"
    value: ${{ steps.release-plz.outputs.prs }}
  pr:
    description: "The release PR opened by release-plz."
    value: ${{ steps.release-plz.outputs.pr }}
  releases:
    description: "The JSON output of the `release` command."
    value: ${{ steps.release-plz.outputs.releases }}
  prs_created:
    description: "Whether release-plz created any release PR."
    value: ${{ steps.release-plz.outputs.prs_created }}
  releases_created:
    description: "Whether release-plz released any package."
    value: ${{ steps.release-plz.outputs.releases_created }}
branding:
  icon: "zap"
  color: "yellow"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # Install cargo-semver-checks with install-action instead of cargo-binstall
    # to avoid checking crates-io
    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
      with:
        tool: cargo-semver-checks@0.48
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
      env:
        BINSTALL_VERSION: 1.20.1
    # Install release-plz using cargo-binstall instead of install-action because we
    # don't want to wait the 3 hour install-action release cadence before releasing a new
    # version of this action.
    - name: Install release-plz
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        cargo-binstall \
            "release-plz@${INPUT_VERSION}"\
            --force\
            --strategies=crate-meta-data,compile\
            --no-confirm
    - name: Configure git user from GitHub token
      uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
    - name: Run release-plz
      id: release-plz
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_FORGE: ${{ inputs.forge }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_PROJECT_MANIFEST: ${{ inputs.project_manifest }}
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        if [[ -n "$INPUT_CONFIG" ]]
        then
            echo "using config from '$INPUT_CONFIG'"
            # Use arrays so that inputs can contain spaces
            CONFIG_PATH=("--config" "$INPUT_CONFIG")
        else
            CONFIG_PATH=()
        fi

        if [[ -n "$INPUT_VERBOSE" ]]
        then
            VERBOSE=("-v")
        else
            VERBOSE=()
        fi

        if [[ -n "$INPUT_DRY_RUN" ]]
        then
            DRY_RUN=("--dry-run")
        else
            DRY_RUN=()
        fi

        if [[ -n "$INPUT_TOKEN" ]]
        then
            echo "using custom registry token'"
            TOKEN=("--token" "$INPUT_TOKEN")
        else
            TOKEN=()
        fi

        if [[ -n "$INPUT_FORGE" ]]
        then
          echo "Using forge '$INPUT_FORGE'"
          FORGE=("--forge" "$INPUT_FORGE")
        elif [[ -n "$INPUT_BACKEND" ]]
        then
          echo "'backend' input is supported for backward compatibility. Use 'forge' instead."
          echo "Using backend '$INPUT_BACKEND'"
          FORGE=("--forge" "$INPUT_BACKEND")
        else
          FORGE=()
        fi

        if [[ -n "$INPUT_REGISTRY" ]]
        then
            echo "using registry '$INPUT_REGISTRY'"
            ALT_REGISTRY=("--registry" "$INPUT_REGISTRY")
        else
            ALT_REGISTRY=()
        fi

        if [[ -n "$INPUT_MANIFEST_PATH" ]]
        then
            echo "using manifest path '$INPUT_MANIFEST_PATH'"
            MANIFEST_PATH=("--manifest-path" "$INPUT_MANIFEST_PATH")
        elif [[ -n "$INPUT_PROJECT_MANIFEST" ]]
        then
            echo "using manifest path '$INPUT_PROJECT_MANIFEST'"
            MANIFEST_PATH=("--project-manifest" "$INPUT_PROJECT_MANIFEST")
        else
            MANIFEST_PATH=()
        fi

        if [[ -z "$INPUT_COMMAND" || "$INPUT_COMMAND" == "release-pr" ]]
        then
            echo "-- Running release-plz release-pr --"
            release_pr_output=$(release-plz release-pr\
                --git-token "${GITHUB_TOKEN}"\
                --repo-url "https://github.com/${GITHUB_REPOSITORY}"\
                "${CONFIG_PATH[@]}"\
                "${ALT_REGISTRY[@]}"\
                "${MANIFEST_PATH[@]}"\
                "${FORGE[@]}"\
                "${VERBOSE[@]}"\
                -o json)
            echo "release_pr_output: $release_pr_output"
            prs=$(echo "$release_pr_output" | jq -c .prs)
            echo "prs=$prs" >> "$GITHUB_OUTPUT"
            prs_length=$(echo "$prs" | jq 'length')
            if [ "$prs_length" != "0" ]; then
                prs_created=true
                first_pr=$(echo "$prs" | jq -c .[0])
            else
                prs_created=false
                first_pr="{}"
            fi
            echo "pr=$first_pr" >> "$GITHUB_OUTPUT"
            echo "prs_created=$prs_created" >> "$GITHUB_OUTPUT"
        fi

        if [[ -z "$INPUT_COMMAND" || "$INPUT_COMMAND" == "release" ]]
        then
            echo "-- Running release-plz release --"
            release_output=$(release-plz release\
                --git-token "${GITHUB_TOKEN}"\
                "${CONFIG_PATH[@]}"\
                "${ALT_REGISTRY[@]}"\
                "${MANIFEST_PATH[@]}"\
                "${FORGE[@]}"\
                "${TOKEN[@]}"\
                "${VERBOSE[@]}"\
                "${DRY_RUN[@]}"\
                -o json)
            echo "release_output: $release_output"
            releases=$(echo $release_output | jq -c .releases)
            echo "releases=$releases" >> "$GITHUB_OUTPUT"
            releases_length=$(echo "$releases" | jq 'length')
            if [ "$releases_length" != "0" ]; then
                releases_created=true
            else
                releases_created=false
            fi
            echo "releases_created=$releases_created" >> "$GITHUB_OUTPUT"
        fi
